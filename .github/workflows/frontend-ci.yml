name: (Deprecated) Frontend CI (Nested Path)

on:
  push:
    branches: [main, master]
    paths:
      - "FabriqFrontend/**"
  pull_request:
    branches: [main, master]
    paths:
      - "FabriqFrontend/**"
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Print deprecation notice
        run: |
          echo "This workflow file has moved to repository root at .github/workflows/frontend-ci.yml." \
               "Please delete FabriqFrontend/frontend/.github/workflows/frontend-ci.yml."
